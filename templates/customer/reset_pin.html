{% extends 'base.html' %}
{% block title %}Reset Transaction PIN — Bank of Pattanagere{% endblock %}
{% block page_title %}Reset Transaction PIN{% endblock %}

{% block content %}
<div class="max-w-xl mx-auto mt-8 animate-fade-in">
    <div class="bg-white rounded-2xl shadow-card p-8 md:p-10 border border-slate-200 relative overflow-hidden">
        
        <!-- Decorative bg -->
        <div class="absolute top-0 right-0 p-8 opacity-5 pointer-events-none">
            <svg class="w-48 h-48" fill="currentColor" viewBox="0 0 24 24"><path d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
        </div>

        <div class="text-center mb-8 relative z-10">
            <div class="w-16 h-16 bg-red-50 text-red-600 rounded-2xl flex items-center justify-center mx-auto mb-4 ring-8 ring-red-50/50">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"/></svg>
            </div>
            <h1 class="text-2xl font-bold text-slate-800 tracking-tight">Reset Transaction PIN</h1>
            <p class="text-slate-500 text-sm mt-2">Verify your login password to securely set a new Transaction PIN.</p>
        </div>

        <form method="POST" action="{{ url_for('customer.reset_pin') }}" class="space-y-6 relative z-10">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

            <div class="bg-slate-50 p-6 rounded-xl border border-slate-200 mb-6">
                <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Account Login Password <span class="text-red-500">*</span></label>
                <input type="password" name="password" required placeholder="Enter your current password"
                    class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none transition-all font-medium text-slate-800 shadow-sm">
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">New PIN <span class="text-red-500">*</span></label>
                    <input type="password" name="new_pin" required maxlength="4" pattern="\d{4}" placeholder="••••"
                        class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none text-xl tracking-[1em] text-center font-mono transition-all shadow-sm">
                </div>

                <div>
                    <label class="block text-xs font-bold text-slate-500 uppercase tracking-wider mb-2">Confirm PIN <span class="text-red-500">*</span></label>
                    <input type="password" name="confirm_pin" required maxlength="4" pattern="\d{4}" placeholder="••••"
                        class="w-full px-4 py-3 bg-white border border-slate-300 rounded-xl focus:ring-4 focus:ring-primary/10 focus:border-primary outline-none text-xl tracking-[1em] text-center font-mono transition-all shadow-sm">
                </div>
            </div>

            <div class="flex gap-4 pt-6 mt-4 border-t border-slate-100">
                <a href="{{ url_for('customer.security') }}" class="flex-1 py-3.5 bg-white border border-slate-200 hover:bg-slate-50 text-slate-700 font-bold rounded-xl transition-colors text-center shadow-sm">
                    Cancel
                </a>
                <button type="submit" class="flex-1 py-3.5 bg-primary hover:bg-primary-dark text-white font-bold rounded-xl transition-all shadow-subtle hover:shadow-card active:scale-[0.98]">
                    Reset PIN
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
