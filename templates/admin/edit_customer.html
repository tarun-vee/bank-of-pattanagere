{% extends 'base_admin.html' %}
{% block title %}Edit Customer — Bank of Pattanagere{% endblock %}
{% block content %}
<div class="max-w-lg mx-auto">
    <h1 class="text-2xl font-bold text-gray-800 mb-6">Edit Customer — {{ customer.name }}</h1>
    <div class="bg-white rounded-2xl border border-gray-100 shadow-sm p-6">
        <form method="POST" class="space-y-5">
            <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Name</label>
                <input type="text" name="name" value="{{ customer.name }}" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Email (read-only)</label>
                <input type="email" value="{{ customer.email }}" disabled class="w-full px-4 py-2.5 bg-gray-50 border border-gray-200 rounded-xl text-sm text-gray-500">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Phone</label>
                <input type="tel" name="phone" value="{{ customer.phone }}" required class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none text-sm">
            </div>
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Address</label>
                <textarea name="address" rows="3" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none text-sm resize-none">{{ customer.address or '' }}</textarea>
            </div>
            {% if customer.account %}
            <div>
                <label class="block text-sm font-medium text-gray-700 mb-1">Account Type</label>
                <select name="account_type" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl text-sm bg-white focus:ring-2 focus:ring-primary/30 outline-none">
                    <option value="savings" {% if customer.account.account_type == 'savings' %}selected{% endif %}>Savings</option>
                    <option value="current" {% if customer.account.account_type == 'current' %}selected{% endif %}>Current</option>
                </select>
            </div>
            {% endif %}
            <div class="flex gap-3">
                <button type="submit" class="px-6 py-2.5 bg-primary hover:bg-primary-dark text-white text-sm font-medium rounded-xl transition-colors">Save</button>
                <a href="{{ url_for('admin.customers') }}" class="px-6 py-2.5 bg-gray-100 hover:bg-gray-200 text-gray-700 text-sm font-medium rounded-xl transition-colors">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
