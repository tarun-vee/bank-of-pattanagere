{% extends 'base_auth.html' %}
{% block title %}Forgot Password — Bank of Pattanagere{% endblock %}

{% block content %}
<div class="bg-white rounded-2xl shadow-xl p-8 border border-gray-100 animate-fade-in">
    <div class="text-center mb-6">
        <div class="w-14 h-14 bg-yellow-100 rounded-2xl flex items-center justify-center mx-auto mb-3">
            <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 7a2 2 0 012 2m4 0a6 6 0 01-7.743 5.743L11 17H9v2H7v2H4a1 1 0 01-1-1v-2.586a1 1 0 01.293-.707l5.964-5.964A6 6 0 1121 9z"/></svg>
        </div>
        <h1 class="text-xl font-bold text-gray-800">Reset Password</h1>
        <p class="text-gray-500 text-sm mt-1">Answer your security question to reset</p>
    </div>

    <form method="POST" action="{{ url_for('auth.forgot_password') }}" class="space-y-4">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Email Address</label>
            <input type="email" name="email" required value="{{ email|default('') }}" placeholder="your@email.com"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all text-sm">
        </div>

        {% if security_question %}
        <div class="bg-blue-50 p-4 rounded-xl border border-blue-200">
            <p class="text-sm font-medium text-blue-700">{{ security_question }}</p>
        </div>
        {% endif %}

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Security Answer</label>
            <input type="text" name="security_answer" required placeholder="Your security answer"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all text-sm">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">New Password</label>
            <input type="password" name="new_password" required placeholder="Enter new password"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all text-sm">
        </div>

        <div>
            <label class="block text-sm font-medium text-gray-700 mb-1">Confirm New Password</label>
            <input type="password" name="confirm_password" required placeholder="Repeat new password"
                class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:ring-2 focus:ring-primary/30 focus:border-primary outline-none transition-all text-sm">
        </div>

        <button type="submit"
            class="w-full py-3 bg-primary hover:bg-primary-dark text-white font-semibold rounded-xl transition-all duration-200 shadow-lg shadow-primary/25 active:scale-[0.98]">
            Reset Password
        </button>
    </form>

    <p class="text-center text-sm text-gray-500 mt-5">
        <a href="{{ url_for('auth.login') }}" class="text-primary font-semibold hover:text-primary-dark transition-colors">← Back to Login</a>
    </p>
</div>
{% endblock %}
